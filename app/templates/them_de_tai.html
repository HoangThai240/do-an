{% extends "layout/base.html" %}

{% block title %}
Thêm đề tài | Nghiên Cứu AI
{% endblock %}

{% block content %}

<section
    class="
        min-h-screen
        bg-gradient-to-br
        from-blue-50
        via-white
        to-purple-50
        py-12
    "
>

    <div
        class="
            max-w-4xl
            mx-auto
            px-4
            sm:px-6
            lg:px-8
        "
    >

        <!-- HEADER -->
        <div class="mb-8">

            <a
                href="{{ url_for('danh_sach_de_tai') }}"
                class="
                    inline-flex
                    items-center
                    gap-2
                    text-sm
                    text-slate-500
                    hover:text-primary
                    transition-colors
                    mb-5
                "
            >
                <i
                    data-lucide="arrow-left"
                    class="w-4 h-4"
                ></i>

                Quay lại danh sách đề tài
            </a>

            <h1
                class="
                    text-3xl
                    md:text-4xl
                    font-extrabold
                    text-slate-900
                "
            >
                Thêm đề tài nghiên cứu
            </h1>

            <p
                class="
                    text-slate-500
                    mt-2
                "
            >
                Điền thông tin đề tài nghiên cứu của bạn.
            </p>

        </div>


        <!-- FORM -->
        <form
            method="POST"
            class="
                bg-white
                rounded-3xl
                border
                border-slate-100
                shadow-soft
                p-6
                md:p-10
                space-y-7
            "
        >

            <!-- TÊN ĐỀ TÀI -->
            <div>

                <label
                    class="
                        block
                        text-sm
                        font-bold
                        text-slate-700
                        mb-2
                    "
                >
                    Tên đề tài
                    <span class="text-red-500">*</span>
                </label>

                <input
                    type="text"
                    name="tenDeTai"
                    required
                    placeholder="Nhập tên đề tài nghiên cứu"
                    class="
                        w-full
                        px-4
                        py-3
                        rounded-xl
                        border
                        border-slate-200
                        outline-none
                        focus:border-primary
                        focus:ring-4
                        focus:ring-blue-100
                        transition-all
                    "
                >

            </div>


            <!-- LĨNH VỰC -->
            <div>

                <label
                    class="
                        block
                        text-sm
                        font-bold
                        text-slate-700
                        mb-2
                    "
                >
                    Lĩnh vực nghiên cứu
                    <span class="text-red-500">*</span>
                </label>

                <select
                    name="linh_vuc_id"
                    required
                    class="
                        w-full
                        px-4
                        py-3
                        rounded-xl
                        border
                        border-slate-200
                        bg-white
                        outline-none
                        focus:border-primary
                        focus:ring-4
                        focus:ring-blue-100
                        transition-all
                    "
                >

                    <option value="">
                        -- Chọn lĩnh vực --
                    </option>

                    {% for lv in danh_sach_linh_vuc %}

                        <option value="{{ lv.id }}">
                            {{ lv.tenLinhVuc }}
                        </option>

                    {% endfor %}

                </select>

            </div>


            <!-- MÔ TẢ -->
            <div>

                <label
                    class="
                        block
                        text-sm
                        font-bold
                        text-slate-700
                        mb-2
                    "
                >
                    Mô tả đề tài
                    <span class="text-red-500">*</span>
                </label>

                <textarea
                    name="moTa"
                    rows="7"
                    required
                    placeholder="Mô tả nội dung, mục tiêu và phạm vi nghiên cứu..."
                    class="
                        w-full
                        px-4
                        py-3
                        rounded-xl
                        border
                        border-slate-200
                        outline-none
                        resize-none
                        focus:border-primary
                        focus:ring-4
                        focus:ring-blue-100
                        transition-all
                    "
                ></textarea>

            </div>


            <!-- BUTTON -->
            <div
                class="
                    flex
                    flex-col-reverse
                    sm:flex-row
                    justify-end
                    gap-3
                    pt-4
                    border-t
                    border-slate-100
                "
            >

                <a
                    href="{{ url_for('danh_sach_de_tai') }}"
                    class="
                        px-6
                        py-3
                        rounded-xl
                        border
                        border-slate-200
                        text-slate-600
                        font-semibold
                        text-center
                        hover:bg-slate-50
                        transition-all
                    "
                >
                    Hủy
                </a>

                <button
                    type="submit"
                    class="
                        px-7
                        py-3
                        rounded-xl
                        bg-gradient-to-r
                        from-primary
                        to-secondary
                        text-white
                        font-bold
                        shadow-btn
                        hover:opacity-90
                        transition-all
                        flex
                        items-center
                        justify-center
                        gap-2
                    "
                >

                    <i
                        data-lucide="plus-circle"
                        class="w-5 h-5"
                    ></i>

                    Thêm đề tài

                </button>

            </div>

        </form>

    </div>

</section>

{% endblock %}
