{% extends "layout/base.html" %}

{% block title %}
Nghiệm thu đề tài
{% endblock %}

{% block content %}

<div class="min-h-screen bg-slate-50 py-10">

    <div class="max-w-4xl mx-auto px-4">

        <!-- HEADER -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6">

            <h1 class="text-2xl font-bold text-slate-800">
                Nghiệm thu đề tài
            </h1>

            <p class="mt-2 text-slate-500">
                {{ de_tai.tenDeTai }}
            </p>

        </div>


        <!-- FORM -->
        <form
            method="POST"
            class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6"
        >

            <!-- ĐIỂM -->
            <div class="mb-5">

                <label class="block font-semibold text-slate-700 mb-2">
                    Điểm nghiệm thu
                </label>

                <input
                    type="number"
                    name="diem"
                    min="0"
                    max="10"
                    step="0.1"
                    value="{{ ket_qua.diem if ket_qua else '' }}"
                    required
                    class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500"
                >

            </div>


            <!-- NHẬN XÉT -->
            <div class="mb-5">

                <label class="block font-semibold text-slate-700 mb-2">
                    Nhận xét
                </label>

                <textarea
                    name="nhan_xet"
                    rows="5"
                    class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500"
                    placeholder="Nhập nhận xét về đề tài..."
                >{{ ket_qua.nhanXet if ket_qua else '' }}</textarea>

            </div>


            <!-- KẾT LUẬN -->
            <div class="mb-5">

                <label class="block font-semibold text-slate-700 mb-2">
                    Kết luận
                </label>

                <textarea
                    name="ket_luan"
                    rows="4"
                    class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500"
                    placeholder="Nhập kết luận nghiệm thu..."
                >{{ ket_qua.ketLuan if ket_qua else '' }}</textarea>

            </div>


            <!-- TRẠNG THÁI -->
            <div class="mb-6">

                <label class="block font-semibold text-slate-700 mb-2">
                    Kết quả
                </label>

                <select
                    name="trang_thai"
                    required
                    class="w-full px-4 py-3 rounded-xl border border-slate-300"
                >

                    <option value="">
                        -- Chọn kết quả --
                    </option>

                    <option
                        value="DAT"
                        {% if ket_qua and ket_qua.trangThai == 'DAT' %}
                        selected
                        {% endif %}
                    >
                        Đạt
                    </option>

                    <option
                        value="KHONG_DAT"
                        {% if ket_qua and ket_qua.trangThai == 'KHONG_DAT' %}
                        selected
                        {% endif %}
                    >
                        Không đạt
                    </option>

                </select>

            </div>


            <!-- BUTTON -->
            <div class="flex justify-end gap-3">

                <a
                    href="{{ url_for('admin_dashboard') }}"
                    class="px-5 py-3 rounded-xl bg-slate-100 hover:bg-slate-200 font-semibold"
                >
                    Quay lại
                </a>

                <button
                    type="submit"
                    class="px-5 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold"
                >
                    Lưu kết quả nghiệm thu
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
